# yaml-language-server: $schema=../../schemas/json/typo3-rte-preset.json
# EXT:my_sitepackage/Configuration/RTE/MySitepackage.yaml
imports:
  - resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml'
  - resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml'
  - resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml'

editor:
  config:
    contentsCss:
      - 'EXT:my_sitepackage/Resources/Public/Css/rte.css'
    width: auto
    height: 300
    debug: false
    importModules:
      - '@ckeditor/ckeditor5-font'
      - module: '@my-vendor/my-sitepackage/ckeditor5-timestamp.js'
        exports:
          - Timestamp
    removeImportModules:
      - '@ckeditor/ckeditor5-media-embed'
    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
    style:
      definitions:
        - { name: 'Lead', element: 'p', classes: ['lead'] }
        - { name: 'Button', element: 'a', classes: ['btn', 'btn-primary'] }
    toolbar:
      items:
        - style
        - heading
        - '|'
        - bold
        - italic
        - subscript
        - superscript
        - '|'
        - link
        - bulletedList
        - numberedList
        - '|'
        - label: 'More'
          icon: threeVerticalDots
          tooltip: 'More formatting'
          items:
            - specialCharacters
            - horizontalLine
            - insertTable
        - label: 'Font'
          icon: false
          withText: true
          items:
            - fontSize
            - fontColor
        - '|'
        - timestamp
        - sourceEditing
      shouldNotGroupWhenFull: true

  externalPlugins:
    typo3link:
      route: rteckeditor_wizard_browse_links

processing:
  mode: default
  allowTags:
    - s
    - sub
    - sup
    - mark
  allowTagsOutside: 'hr, address, figure'
  allowAttributes:
    - class
    - id
  HTMLparser_db:
    tags:
      span:
        allowedAttribs: 'class'

buttons:
  link:
    relAttribute:
      enabled: true
    targetSelector:
      disabled: false
    properties:
      class:
        allowedClasses: 'btn, btn-primary'

classes:
  btn:
    name: Button
  btn-primary:
    name: 'Primary button'

classesAnchor:
  - class: btn
    type: page
  - class: btn-primary
    type: url
