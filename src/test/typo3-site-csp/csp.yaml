# yaml-language-server: $schema=../../schemas/json/typo3-site-csp.json
# config/sites/main/csp.yaml
active: true
inheritDefault: true
mutations:
  # Results in `default-src 'self'`
  - mode: set
    directive: default-src
    sources:
      - "'self'"
  - mode: extend
    directive: img-src
    sources:
      - 'data:'
      - 'https://*.example.com'
  - mode: append
    directive: script-src
    sources:
      - "'nonce-proxy'"
      - 'https://www.googletagmanager.com'
  - mode: remove
    directive: script-src-attr
  - mode: inherit-once
    directive: frame-src
  - mode: set
    directive: upgrade-insecure-requests
behavior:
  useNonce: true
  useHash: false
