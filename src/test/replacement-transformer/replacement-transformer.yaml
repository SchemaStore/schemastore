# yaml-language-server: $schema=../../schemas/json/replacement-transformer.json
apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: notImportantHere
replacements:
  - source:
      kind: ConfigMap
      name: example-configmap
      fieldPath: data.name
    targets:
      - select:
          kind: Deployment
          name: example-deploy
        fieldPaths:
          - spec.template.spec.containers.[name=nginx].image
