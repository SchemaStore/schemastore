# yaml-language-server: $schema=../../schemas/json/netlify.json
backend:
  name: github
  repo: example/site
  branch: main
  api_root: https://github.example.com/api/v3
  base_url: https://auth.example.com
  auth_endpoint: oauth/authorize
  cms_label_prefix: cms/
  preview_context: deploy/preview
  signoff_commits: true
  squash_merges: true
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
    openAuthoring: '{{message}}'
publish_mode: editorial_workflow
media_folder: static/images/uploads
public_folder: /images/uploads
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 80
  strip_metadata: true
  width: 1600
  height: null
  aspect_ratio: 16x9
logo:
  src: https://example.com/images/logo.svg
  show_in_header: true
search: false
issue_reports:
  url: https://example.com/issues/new
i18n:
  structure: multiple_folders
  locales: [en, de, fr]
  default_locale: en
editor:
  preview: false
  notes: true
collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    limit: 100
    publish: false
    identifier_field: name
    extension: md
    format: frontmatter
    frontmatter_delimiter: ['(', ')']
    slug: '{{year}}-{{month}}-{{day}}_{{slug}}'
    slug_collision: reject
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    preview_path: 'blog/{{year}}/{{month}}/{{slug}}'
    preview_path_date_field: updated_on
    preview_path_preserve_slashes: true
    filter: { field: language, value: en }
    summary: 'Version: {{version}} - {{title}}'
    editor:
      preview: false
      notes: true
      visualEditing: true
    sortable_fields:
      - commit_date
      - title
      - field: date
        label: Publish date
        default_sort: desc
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Posts published in 2020
        field: date
        pattern: '2020'
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
      - label: Drafts
        field: draft
    i18n: true
    fields:
      - {
          label: Name,
          name: name,
          widget: string,
          hint: 'Shown in the list',
          i18n: true,
        }
      - { label: Date, name: date, widget: datetime, i18n: duplicate }
      - { label: Draft, name: draft, widget: boolean, i18n: none }
      - label: Featured Image
        name: image
        widget: image
        comment: Cover image
        visualEditing: false
        media_processing:
          enabled: true
          format: { enabled: true, default: jpeg }
          quality: 85
          width: 1200
          height: null
          aspect_ratio: 3x2
      - { label: Body, name: body, widget: markdown }
  - name: pages
    label: Pages
    folder: content/pages
    frontmatter_delimiter: '~~~'
    nested:
      depth: 100
      summary: '{{title}}'
      subfolders: false
    meta:
      path:
        widget: string
        label: Path
        index_file: _index
        required: false
    fields:
      - { label: Title, name: title, widget: string }
  - name: settings
    label: Settings
    i18n:
      structure: single_file
      locales: [en, de]
    files:
      - name: about
        label: About Page
        file: site/content/about.yml
        description: The about page
        i18n: true
        editor:
          preview: false
        media_folder: ''
        public_folder: ''
        preview_path: about
        preview_path_date_field: date
        fields:
          - { label: Title, name: title, widget: string, i18n: translate }
