# yaml-language-server: $schema=../../schemas/json/cloudbuild.json
availableSecrets:
  secretManager:
    - versionName: projects/my-project/secrets/docker-password/versions/latest
      env: PASSWORD
  inline:
    - kmsKeyName: projects/my-project/locations/global/keyRings/my-ring/cryptoKeys/my-key
      envMap:
        USERNAME: ENCRYPTED_USERNAME
options:
  defaultLogsBucketBehavior: LEGACY_BUCKET
  enableStructuredLogging: true
  pubsubTopic: my-build-topic
  workerRelease: regular
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker login --username=$$USERNAME --password=$$PASSWORD']
    secretEnv: ['USERNAME', 'PASSWORD']
    results:
      - name: image-digest
        attestationContent: digest
        attestationType: https://cloudbuild.googleapis.com/attestations/build_content_restrictions
