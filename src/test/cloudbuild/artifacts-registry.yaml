# yaml-language-server: $schema=../../schemas/json/cloudbuild.json
steps:
  - name: gcr.io/cloud-builders/go
    args: ['build', './...']
artifacts:
  goModules:
    - repositoryName: quickstart-go-repo
      repositoryLocation: us-central1
      repositoryProjectId: my-project
      sourcePath: /workspace/myapp
      modulePath: example.com/myapp
      moduleVersion: v1.0.0
  mavenArtifacts:
    - repository: https://us-central1-maven.pkg.dev/my-project/my-java-repo
      deployFolder: /workspace/target
      path: /workspace/my-app/target/my-app-1.0-SNAPSHOT.jar
      artifactId: my-app-1
      groupId: com.mycompany.app
      version: 1.0.0
  oci:
    - file: /workspace/image
      registryPath: us-central1-docker.pkg.dev/my-project/my-repo
      tags: [latest, v1]
  genericArtifacts:
    - folder: /workspace/dist
      registryPath: projects/my-project/locations/us-central1/repositories/my-repo/packages/my-package/versions/1.0.0
