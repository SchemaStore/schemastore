# yaml-language-server: $schema=../../schemas/json/typo3-form-definition.json
# EXT:my_sitepackage/Resources/Private/Forms/contact.form.yaml
renderingOptions:
  submitButtonLabel: Submit
type: Form
identifier: contact
label: 'Contact form'
prototypeName: standard
finishers:
  - identifier: EmailToReceiver
    options:
      subject: 'Contact request from {name}'
      recipients:
        info@example.com: 'Example Inc.'
      senderAddress: noreply@example.com
      senderName: 'Example website'
      replyToRecipients:
        '{email}': '{name}'
      addHtmlPart: true
      attachUploads: true
      title: 'New contact request'
  - identifier: SaveToDatabase
    options:
      table: tx_mysitepackage_domain_model_request
      mode: insert
      elements:
        name:
          mapOnDatabaseColumn: name
        email:
          mapOnDatabaseColumn: email
  - identifier: Confirmation
    options:
      message: 'Thank you for your message.'
renderables:
  - identifier: page-1
    type: Page
    label: 'Contact'
    renderingOptions:
      previousButtonLabel: 'Previous step'
      nextButtonLabel: 'Next step'
    renderables:
      - identifier: name
        type: Text
        label: 'Name'
        defaultValue: ''
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Your name'
            required: required
        validators:
          - identifier: NotEmpty
          - identifier: StringLength
            options:
              minimum: 2
              maximum: 100
      - identifier: email
        type: Email
        label: 'Email address'
        validators:
          - identifier: NotEmpty
          - identifier: EmailAddress
      - identifier: subject
        type: SingleSelect
        label: 'Subject'
        properties:
          prependOptionLabel: 'Please choose'
          options:
            general: 'General question'
            support: 'Support'
            jobs: 'Jobs'
      - identifier: details
        type: Fieldset
        label: 'Details'
        renderables:
          - identifier: message
            type: Textarea
            label: 'Message'
            validators:
              - identifier: NotEmpty
          - identifier: attachment
            type: FileUpload
            label: 'Attachment'
            properties:
              saveToFileMount: '1:/user_upload/'
              allowedMimeTypes:
                - application/pdf
            validators:
              - identifier: FileSize
                options:
                  minimum: 0B
                  maximum: 10M
      - identifier: privacy
        type: Checkbox
        label: 'I accept the privacy policy.'
        validators:
          - identifier: NotEmpty
      - identifier: honeypot
        type: Honeypot
  - identifier: summarypage
    type: SummaryPage
    label: 'Summary'
    variants:
      - identifier: hide-summary-for-jobs
        condition: 'formValues["subject"] == "jobs"'
        renderingOptions:
          enabled: false
