# yaml-language-server: $schema=../../schemas/json/kustomization.json
helmCharts:
  - repo: https://kubernetes-sigs.github.io/descheduler
    name: descheduler
    version: 0.33.0
    releaseName: descheduler
    namespace: kube-system
    valuesInline:
      kind: CronJob
      suspend: true
      failedJobsHistoryLimit: 1
      imagePullSecrets: null
      tolerations: []
      resources: {}
