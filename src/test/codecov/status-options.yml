# yaml-language-server: $schema=../../schemas/json/codecov.json
# Based on the example at https://docs.codecov.com/docs/commit-status
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5
        if_ci_failed: failure
        if_not_found: ignore
    patch:
      default:
        target: 80%
        threshold: 0.5
        if_ci_failed: ignore
        if_not_found: error
