#:schema ../../schemas/json/snowflake-config.json
default_connection_name = "myconnection"

[connections.myconnection]
account = "myaccount"
user = "jondoe"

[cli]
auto_upgrade = true
auto_upgrade_allow_major = false
output_format = "JSON"
ignore_new_version_warning = true
air_gapped = false

[cli.logs]
save_logs = true
level = "info"

[cli.encoding]
file_io = "utf-8"
subprocess = "utf-8"
stdout = "utf-8"

[cli.features]
enable_separate_authentication_policy_id = true
