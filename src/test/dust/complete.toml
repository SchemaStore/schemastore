#:schema ../../schemas/json/dust.json

display-full-paths = true
display-apparent-size = true
reverse = true
no-colors = false
force-colors = true
no-bars = true
skip-total = true
screen-reader = false
ignore-hidden = true
only-dir = true
only-file = true
disable-progress = true
bars-on-right = true
output-json = true
print-errors = true
output-format = "gib"
min-size = "10M"
files0-from = "paths.bin"
files-from = "paths.txt"
depth = 4
stack-size = 8388608
threads = 8
number-of-lines = 40
collapse = ["target", "node_modules"]
future-option = "accepted by Dust"
