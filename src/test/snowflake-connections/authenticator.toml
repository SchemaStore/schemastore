#:schema ../../schemas/json/snowflake-connections.json
[default]
account = "myaccount"
user = "jondoe"
authenticator = "snowflake"

[jwt]
account = "myaccount"
user = "jondoe"
authenticator = "SNOWFLAKE_JWT"
private_key_file = "~/.ssh/snowflake_private_key.p8"

[oauth_code]
account = "myaccount"
authenticator = "OAUTH_AUTHORIZATION_CODE"

[wif]
account = "myaccount"
authenticator = "WORKLOAD_IDENTITY"
workload_identity_provider = "aws"

[okta]
account = "myaccount"
user = "jondoe@example.com"
password = "******"
authenticator = "https://example.okta.com"
