# yaml-language-server: $schema=../../schemas/json/typo3-form-config.json
# EXT:my_sitepackage/Configuration/Form/MySitepackage/config.yaml
name: my-vendor/my-sitepackage-form
label: 'My Sitepackage: Form'
priority: 200

persistenceManager:
  allowedExtensionPaths:
    10: 'EXT:my_sitepackage/Resources/Private/Forms/'
  allowSaveToExtensionPaths: true
  allowDeleteFromExtensionPaths: false
  sortByKeys:
    - name
    - fileUid
  sortAscending: true

prototypes:
  standard:
    formElementsDefinition:
      Form:
        renderingOptions:
          templateRootPaths:
            100: 'EXT:my_sitepackage/Resources/Private/Templates/Form/Frontend/'
          partialRootPaths:
            100: 'EXT:my_sitepackage/Resources/Private/Partials/Form/Frontend/'
          layoutRootPaths:
            100: 'EXT:my_sitepackage/Resources/Private/Layouts/Form/Frontend/'
      Text:
        properties:
          containerClassAttribute: 'form-group'
          elementClassAttribute: 'form-control'
      Postcode:
        implementationClassName: 'TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement'
        properties:
          fluidAdditionalAttributes:
            inputmode: numeric
        validators:
          - identifier: Postcode
        formEditor:
          label: 'Postcode'
          group: input
          groupSorting: 1000
          iconIdentifier: form-text
      AdvancedPassword: ~
    finishersDefinition:
      Newsletter:
        implementationClassName: 'MyVendor\MySitepackage\Domain\Finishers\NewsletterFinisher'
        options:
          listId: 12
        formEditor:
          iconIdentifier: form-finisher
          label: 'Newsletter subscription'
        FormEngine:
          label: 'Newsletter subscription'
          elements:
            listId:
              label: 'List ID'
              config:
                type: input
    validatorsDefinition:
      Postcode:
        implementationClassName: 'MyVendor\MySitepackage\Validation\PostcodeValidator'
        options:
          country: DE
        formEditor:
          iconIdentifier: form-validator
          label: 'Postcode'
    formEditor:
      translationFiles:
        100: 'EXT:my_sitepackage/Resources/Private/Language/Form/locallang.xlf'
    formEngine:
      translationFiles:
        100: 'EXT:my_sitepackage/Resources/Private/Language/Form/locallang.xlf'

formManager:
  translationFiles:
    100: 'EXT:my_sitepackage/Resources/Private/Language/Form/locallang.xlf'
