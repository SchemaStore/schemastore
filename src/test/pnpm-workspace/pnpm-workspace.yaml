# yaml-language-server: $schema=../../schemas/json/pnpm-workspace.json
# https://pnpm.io/pnpm-workspace_yaml
packages:
  - packages/*

packageConfigs:
  project-1:
    saveExact: true
  project-2:
    savePrefix: '~'

catalog:
  chalk: ^4.1.2

# https://pnpm.io/settings#syncinjecteddepsafterscripts
syncInjectedDepsAfterScripts:
  - build

# https://pnpm.io/catalogs
catalogs:
  react16:
    react: ^16.7.0
    react-dom: ^16.7.0
  react17:
    react: ^17.10.0
    react-dom: ^17.10.0

# https://pnpm.io/cli/add#--save-exact--e
saveExact: true

# https://pnpm.io/cli/install#--prefer-offline
preferOffline: true

# https://pnpm.io/cli/run#--workspace-concurrency
workspaceConcurrency: 5

# https://pnpm.io/cli/install#--reportername
reporter: append-only

# embedReadme is undocumented on pnpm.io; added in pnpm 6.28.0 (https://github.com/pnpm/pnpm/pull/4265)
embedReadme: true

# https://pnpm.io/cli/publish#--provenance
provenance: true

# https://pnpm.io/settings/versioning
versioning:
  fixed:
    - ['@example/cli', '@example/napi']
  ignore:
    - '@example/internal'
  maxBump: patch
  lanes:
    '@example/cli': alpha
  epics:
    - lead: '@example/app'
      packages:
        - './packages/**'
        - '!./packages/private-*'
  changelog:
    storage: repository
