# yaml-language-server: $schema=../../schemas/json/pnpm-workspace.json
# https://pnpm.io/blog/releases/12.12.0

# https://pnpm.io/settings/peer-dependencies#addmissingpeertypes
addMissingPeerTypes: true

# https://pnpm.io/settings/build#remotecache
# Only `org` may live in pnpm-workspace.yaml; url, team, trustedKeys, publish,
# privateKey, keyId, builderId, imageDigest, architectureBaseline and buildEnv
# are read from the global config file or the PNPM_REMOTE_CACHE_* environment.
remoteCache:
  org: acme

sideEffectsCache:
  remote:
    packages:
      - native-addon
