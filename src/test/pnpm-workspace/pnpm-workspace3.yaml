# yaml-language-server: $schema=../../schemas/json/pnpm-workspace.json
# https://pnpm.io/settings/store#lockfileincluderesolutionsettings
lockfile:
  includeResolutionSettings: true

# https://pnpm.io/settings/build#permissions
permissions:
  esbuild:
    build: true
    skills: false
  '@example/tool':
    build: false
    skills: true
  fresh-package:
    build: set this to true or false
    skills: set this to true or false

# https://pnpm.io/settings/build#skillsdirs
skills:
  dirs:
    - .claude/skills
    - .agents/skills
