#:schema ../../schemas/json/bunfig.json
# Use other value forms that Bun's config parser accepts.

[install]
auto = true
cache = false
ca = ["certificate-a", "certificate-b"]
registry = { url = "https://registry.example.com/", username = "user", password = "password" }

[serve.static]
plugins = "./plugin.ts"
env = false
sourcemap = true

[test]
coverageReporter = "lcov"
coverageThreshold = { lines = 0.8, functions = 0.9, statements = 0.7 }
concurrentTestGlob = ["**/concurrent-*.test.ts", "**/parallel-*.test.ts"]
