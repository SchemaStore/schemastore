# yaml-language-server: $schema=../../schemas/json/chezmoi.json
hooks:
  read-source-state:
    pre:
      command: echo
      args: [reading]
interpreters:
  py:
    command: python
    args: [-B]
textConv:
  - pattern: '*.md'
    command: pandoc
    args: ['--to', 'plain']
data:
  nested:
    enabled: true
scriptEnv:
  CI: 'true'
