#:schema ../../schemas/json/chezmoi.json

cacheDir = ".cache"
color = "auto"
format = "json"
destDir = "."
interactive = true
lessInteractive = false
mode = "file"
pager = "less"
pagerArgs = ["-FRX"]
persistentState = ".state"
progress = true
safe = true
scriptTempDir = ".tmp"
sourceDir = "."
tempDir = ".tmp"
umask = 0o22
useBuiltinAge = "auto"
useBuiltinGit = false
verbose = true
workingTree = "."
encryption = "transparent"

[data]
owner = "example"

[env]
EDITOR = "code"

[gitHub]
refreshPeriod = "1m"

[hooks.apply.pre]
command = "echo"
args = ["before apply"]

[hooks.apply.post]
script = "echo after apply"

[interpreters.ps1]
command = "pwsh"
args = ["-NoProfile", "-File"]

[pinentry]
command = "pinentry"
args = ["--ttyname", "console"]
options = ["allow-external-password-cache"]

[template]
options = ["missingkey=error"]

[[textConv]]
pattern = "*.txt"
command = "cat"
args = ["--"]

[warnings]
configFileTemplateHasChanged = true

[awsSecretsManager]
region = "us-east-1"
profile = "default"

[azureKeyVault]
defaultVault = "example-vault"

[bitwarden]
command = "bw"
unlock = "auto"

[bitwardenSecrets]
command = "bws"

[dashlane]
command = "dcli"
args = ["--no-color"]

[doppler]
command = "doppler"
args = ["--silent"]
project = "example"
config = "dev"

[ejson]
keyDir = ".keys"
key = "example"

[gopass]
command = "gopass"
mode = "builtin"

[keepassxc]
command = "keepassxc-cli"
database = "passwords.kdbx"
mode = "cache-password"
args = ["--quiet"]
prompt = true

[keeper]
command = "keeper"
args = ["--batch-mode"]

[lastpass]
command = "lpass"

[onepassword]
command = "op"
prompt = true
mode = "account"

[pass]
command = "pass"

[passhole]
command = "ph"
args = ["--quiet"]
prompt = true

[protonPass]
command = "pass-cli"

[rbw]
command = "rbw"

[secret]
command = "secret-helper"
args = ["get"]

[vault]
command = "vault"

[age]
useBuiltin = true
command = "age"
args = ["--armor"]
identity = "identity.txt"
identities = ["identity-2.txt"]
passphrase = false
recipient = "age1example"
recipients = ["age1example2"]
recipientsFile = "recipients.txt"
recipientsFiles = ["recipients-2.txt"]
suffix = ".age"
symmetric = false

[gpg]
command = "gpg"
args = ["--batch"]
recipient = "example@example.com"
recipients = ["another@example.com"]
symmetric = false
suffix = ".asc"

[add]
encrypt = false
secrets = "warning"
templateSymlinks = true

[cd]
command = "pwsh"
args = ["-NoExit"]

[completion]
custom = true

[docker]
command = "docker"

[diff]
command = "diff"
args = ["--unified"]
exclude = ["scripts", "externals"]
pager = "less"
pagerArgs = ["-FRX"]
reverse = false
scriptContents = true

[edit]
command = "code"
args = ["--wait"]
hardlink = true
minDuration = "1s"
watch = true
apply = false

[git]
command = "git"
autoAdd = true
autoCommit = true
autoPush = false
commitMessageTemplate = "Apply changes"
lfs = true

[merge]
command = "vimdiff"
args = ["-f"]

[status]
exclude = ["scripts", "externals"]
pathStyle = "relative"

[update]
command = "git"
args = ["pull", "--ff-only"]
apply = true
recurseSubmodules = true

[verify]
exclude = ["externals"]

[futureSection]
futureOption = true
