#:schema ../../schemas/json/skillcheck.json
format = "github"
max-lines = 500
max-tokens = 8000
min-desc-score = 50
target-agent = "vscode"
strict-vscode = true
strict-cursor = true
strict-all = false
skip-dirname-check = true
skip-ref-check = true
ignore = ["frontmatter", "references.depth"]
analyze-graph = true
semantic = true
history = false
critique-agent = "codex"
graph-agent = "cursor"

[frontmatter]
extension_fields = ["license", "metadata"]
reserved_words = ["acme", "internal"]
