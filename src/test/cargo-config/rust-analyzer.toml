#:schema ../../schemas/json/cargo-config.json
# Source: https://github.com/rust-lang/rust-analyzer/blob/fa88768e772857f332bc8383e3a1c5a4212f9a6e/.cargo/config.toml
[alias]
xtask = "run --package xtask --bin xtask --"
tq = "test -- -q"
qt = "tq"
lint = "clippy --all-targets -- --cap-lints warn"
codegen = "run --package xtask --bin xtask -- codegen"
dist = "run --package xtask --bin xtask -- dist"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc-8"

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
