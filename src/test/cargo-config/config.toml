#:schema ../../schemas/json/cargo-config.json
[build]
jobs = -1
rustc-wrapper = ""
target = ["x86_64-unknown-linux-gnu"]

[env]
RUST_LOG = "info"
OPENSSL_DIR = { value = "vendor/openssl", relative = true }

[http]
proxy = "localhost:8080"
timeout = 0

[source.crates-io]
replace-with = "vendor"
[source.vendor]
directory = "vendor"

[profile.release]
debug = "limited"

[term.progress]
when = "always"
width = 0
