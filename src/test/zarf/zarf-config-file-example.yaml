# yaml-language-server: $schema=../../schemas/json/zarf.json
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: config-file
  description: Demonstrates using a config file to configure the Zarf CLI

values:
  files:
    - values.yaml
components:
  - name: lion
    description: By default, only this component will be deployed when using the config file
    manifests:
      - name: config-example-configmap
        enableTemplating: true
        files:
          - simple-configmap.yaml

  - name: zebra
    optional: true
    description: An optional component that is not selected by the config file

  - name: leopard
    optional: true
    description: Another optional component that is not selected by the config file

attachments:
  readme: readme.md
