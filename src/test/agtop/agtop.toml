#:schema ../../schemas/json/agtop.json

[project]
name = "example"
root = "."
worktree_path = ".worktrees"
repos = ["frontend", "backend"]
test_command = "go test ./..."
ignore_skill_sources = ["experimental"]

[project.dev_server]
command = "npm run dev"
port_strategy = "hash"
base_port = 3000

[[repos]]
name = "frontend"
path = "./frontend"

[[repos]]
name = "backend"
path = "./backend"

[runtime]
default = "claude"

[runtime.claude]
model = "sonnet"
permission_mode = "acceptEdits"
max_turns = 10
allowed_tools = ["Read", "Edit", "Bash"]
subscription = true

[runtime.opencode]
model = "anthropic/claude-sonnet-4"
agent = "build"

[workflows]
quick = ["build"]

[workflows.release]
skills = ["build", "test"]

[skills.build]
model = "sonnet"
timeout = 600
parallel = false
allowed_tools = ["Bash"]
ignore = false

[safety]
blocked_patterns = ["rm -rf /"]
allow_overrides = false

[limits]
max_tokens_per_run = 200000
max_cost_per_run = 5.0
max_concurrent_runs = 3
rate_limit_backoff = 60
rate_limit_max_retries = 3

[merge]
target_branch = "main"
auto_merge = false
merge_strategy = "squash"
fix_attempts = 2
poll_interval = 30
poll_timeout = 1800
golden_update_command = "npm run update-goldens"
conflict_resolution_attempts = 1

[ui]
theme = "dark"
show_token_count = true
show_cost = true
log_scroll_speed = 3

[update]
auto_check = true
repo = "justinpbarnett/agtop"

[integrations.jira]
base_url = "https://example.atlassian.net"
project_key = "PROJ"
auth_env = "JIRA_API_TOKEN"
user_env = "JIRA_USER_EMAIL"
