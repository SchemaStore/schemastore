[build-system]
build-backend = 'scikit_build_core.build'
requires = ['dynamic-metadata', 'scikit-build-core']

[project]
dynamic = ['description', 'version']
name = 'my-package'

[[tool.dynamic-metadata]]
field = 'version'
input = 'src/my_package/__init__.py'
provider = 'dynamic_metadata.regex'

[[tool.dynamic-metadata]]
field = 'description'
provider = 'dynamic_metadata.fancy_pypi_readme'
