# yaml-language-server: $schema=../../schemas/json/bosh-job-spec.json
# Inspired by: https://bosh.io/docs/jobs/#spec
---
name: http-server

description: This job runs a simple HTTP server.

templates:
  bpm.yml: config/bpm.yml
  config.json: config/config.json

packages:
  - http-server

consumes:
  - name: server_name
    type: hostname
    optional: true

provides:
  - name: metrics_api_key
    type: api_key
    properties:
      - id
      - secret

properties:
  listen_port:
    description: 'Port to listen on'
    example: 80
    default: 8080
