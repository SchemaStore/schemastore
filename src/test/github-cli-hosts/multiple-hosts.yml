# yaml-language-server: $schema=../../schemas/json/github-cli-hosts.json
github.com:
  user: primary-user
  git_protocol: ssh
  editor: code --wait
  prompt: enabled
  prefer_editor_prompt: disabled
  pager: less -FRX
  http_unix_socket:
  browser: firefox
  color_labels: enabled
  accessible_colors: enabled
  accessible_prompter: disabled
  spinner: enabled
  oauth_token: not-a-real-token
  users:
    primary-user:
      oauth_token: not-a-real-token
      spinner: disabled
    secure-user:
    future-user:
      future_option: future-value
github.example.com:
  user: enterprise-user
  git_protocol: https
  users:
    enterprise-user:
github.localhost:
  custom_option: true
