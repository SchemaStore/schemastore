#:schema ../../schemas/json/cargo.json
[package]
name = "dependency-sources"
version = "0.1.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = { git = "https://github.com/rust-lang/regex.git", version = "1" }
local = { path = "../local", version = "1" }
shared = { workspace = true }
branch-only = { git = "https://github.com/rust-lang/regex.git", branch = "main" }
tag-only = { git = "https://github.com/rust-lang/regex.git", tag = "1.10.0" }
rev-only = { git = "https://github.com/rust-lang/regex.git", rev = "0c0990399270277832fbb5b91a1fa118e6f63dba" }
registry-only = { version = "1", registry = "my-registry" }
registry-index-only = { version = "1", registry-index = "https://example.com/index" }
