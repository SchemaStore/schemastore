# yaml-language-server: $schema=../../schemas/json/traefik-v3.json
certificatesResolvers:
  enabled:
    acme:
      email: admin@example.com
      storage: acme.json
      tlsChallenge: true
  disabled:
    acme:
      email: admin@example.com
      storage: acme.json
      tlsChallenge: false
      httpChallenge:
        entryPoint: web
  object:
    acme:
      email: admin@example.com
      storage: acme.json
      tlsChallenge: {}
