#:schema ../../schemas/json/quikrun.json
shell = "auto"
platform = "auto"
clear_terminal = "scroll_up"
show_time_took = true
show_command = true
show_divider = true
cache_dir = ".quikrun"
cd_to_file_dir = false
keep_build_artifacts = true
auto_exit = "never"

[commands]
bash = "bash {file_path}"
dart = "dart run {file_path}"
fish = "fish {file_path}"
java = "java {file_path}"
jl = "julia {file_path}"
js = [
    "bun run {file_path}",
    "node {file_path}",
]
cjs = "@js"
mjs = "@js"
lua = "lua {file_path}"
php = "php {file_path}"
pl = "perl {file_path}"
py = "python3 {file_path}"
r = "Rscript {file_path}"
rb = "ruby {file_path}"
sh = "bash {file_path}"
swift = "swift {file_path}"
ts = [
    "@js",
    "ts-node {file_path}",
]
"c++" = "@cpp"
cxx = "@cpp"

[commands.c]
compile = "gcc -Wall -Wextra {file_path} -o {out_file}"
run = "{out_file}"

[commands.cpp]
compile = "g++ -std=c++23 -Wall -Wextra -Wshadow {file_path} -o {out_file}"
run = "{out_file}"

[commands.go]
compile = "go build -o {out_file} {file_path}"
run = "{out_file}"

[commands.hs]
compile = "ghc -o {out_file} {file_path}"
run = "{out_file}"

[commands.kt]
compile = "kotlinc {file_path} -include-runtime -d {out_stem}.jar"
run = "java -jar {out_stem}.jar"

[commands.nim]
compile = "nim c --out:{out_file} {file_path}"
run = "{out_file}"

[commands.rs]
compile = "rustc {file_path} -o {out_file}"
run = "{out_file}"

[commands.v]
compile = "v -o {out_file} {file_path}"
run = "{out_file}"

[commands.zig]
compile = "zig build-exe {file_path} -femit-bin={out_file}"
run = "{out_file}"
