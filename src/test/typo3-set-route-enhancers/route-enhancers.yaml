# yaml-language-server: $schema=../../schemas/json/typo3-set-route-enhancers.json
# EXT:my_sitepackage/Configuration/Sets/MySitepackage/route-enhancers.yaml
imports:
  - resource: 'EXT:my_sitepackage/Configuration/Routes/Shop.yaml'
routeEnhancers:
  ProductDetail:
    type: Simple
    limitToPages: [5]
    routePath: '/show/{product}'
    _arguments:
      product: 'tx_myshop_product/uid'
    defaults:
      product: ''
    requirements:
      product: '[0-9]+'
    aspects:
      product:
        type: PersistedAliasMapper
        tableName: tx_myshop_domain_model_product
        routeFieldName: slug
        routeValuePrefix: '/'
  Pagination:
    type: Plugin
    routePath: '/page/{@widget_0/currentPage}'
    namespace: 'tx_myshop_list'
    aspects:
      '@widget_0/currentPage':
        type: StaticRangeMapper
        start: '1'
        end: '50'
