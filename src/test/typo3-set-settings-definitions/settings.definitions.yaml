# yaml-language-server: $schema=../../schemas/json/typo3-set-settings-definitions.json
# EXT:my_sitepackage/Configuration/Sets/MySitepackage/settings.definitions.yaml
categories:
  MySitepackage:
    label: 'My Sitepackage'
  MySitepackage.layout:
    label: 'Layout'
    description: 'Colors and templates of the website'
    icon: content-panel
    parent: MySitepackage
  MySitepackage.pages:
    label: 'Pages'
    parent: MySitepackage
  MySitepackage.empty:

settings:
  MySitepackage.templateRootPath:
    label: 'Template root path'
    description: 'Path to the **Fluid** templates.'
    type: string
    default: 'EXT:my_sitepackage/Resources/Private/Templates/'
    category: MySitepackage.layout
    options:
      min: 1
      max: 255
  MySitepackage.footerText:
    label: 'Footer text'
    type: text
    default: ''
    category: MySitepackage.layout
  MySitepackage.primaryColor:
    label: 'Primary color'
    type: color
    default: '#ff8700'
    category: MySitepackage.layout
  MySitepackage.overlayColor:
    type: color
    default: 'rgba(0, 0, 0, 0.5)'
  MySitepackage.showBreadcrumb:
    label: 'Show breadcrumb'
    type: bool
    default: true
    tags:
      - navigation
  MySitepackage.enableSearch:
    type: bool
    default: 0
  MySitepackage.newsItemsPerPage:
    label: 'News per page'
    type: int
    default: 10
    options:
      min: 1
      max: 100
      step: 1
  MySitepackage.imageQuality:
    type: number
    default: 0.85
    options:
      min: 0
      max: 1
      step: 0.05
  MySitepackage.imageRatio:
    type: number
    default: '1.5'
  MySitepackage.loginPage:
    label: 'Login page'
    type: page
    default: 0
    category: MySitepackage.pages
  MySitepackage.storagePid:
    type: page
    default: '42'
    readonly: true
    category: MySitepackage.pages
  MySitepackage.socialMediaUrl:
    type: url
    default: 'https://mastodon.social/@example'
    options:
      pattern: '^https://'
  MySitepackage.allowedDomains:
    type: stringlist
    default:
      - example.com
      - example.org
  MySitepackage.cookieNames:
    type: stringlist
    default: '["fe_typo_user", "be_typo_user"]'
  MySitepackage.headerLayout:
    label: 'Header layout'
    type: string
    default: default
    enum:
      default: 'Default'
      wide: 'Wide'
      minimal: ~
  MySitepackage.containerWidth:
    type: int
    default: 1200
    enum:
      - 960
      - 1200
      - 1440
