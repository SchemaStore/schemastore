#:schema ../../schemas/json/commit-check.json
warn = ["branch", "CC003"]

[commit]
conventional_commits = true
message_pattern = ""
subject_capitalized = true
subject_imperative = true
subject_max_length = 72
subject_min_length = 10
allow_commit_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "test",
  "chore",
  "perf",
  "build",
  "ci",
]
allow_merge_commits = false
allow_revert_commits = false
allow_empty_commits = false
allow_fixup_commits = false
allow_wip_commits = false
require_body = true
body_max_line_length = 72
require_signed_off_by = true
ignore_authors = ["dependabot[bot]", "pre-commit-ci[bot]"]
author_email_pattern = '^.+@example\.com$'
author_name_pattern = '^.+ .+$'
ai_attribution = "disclose"
ai_disclosure_trailers = ["Assisted-by"]
ai_disclosure_pattern = '^\S+/\S+$'
require_verified = true

[branch]
conventional_branch = true
require_description_grammar = true
allow_branch_types = [
  "feature",
  "bugfix",
  "hotfix",
  "release",
  "chore",
  "feat",
  "fix",
]
allow_branch_names = ["develop", "staging"]
require_rebase_target = "main"
ignore_authors = ["dependabot[bot]"]

[push]
allow_force_push = false

[tag]
regex = '^v\d+\.\d+\.\d+$'

[files]
max_size = "5MB"
prohibited_patterns = ["*.pem", ".env", "id_rsa*"]
max_path_length = 250

[pull_request]
check = "squash"
ai_declaration_checkboxes = ["No AI tools were used", "AI tools were used"]
body_ai_attribution = true
ai_label = "ai-assisted"

[jira]
required = true
pattern = 'PROJ-\d+'
suggestion = "Reference the PROJ ticket, e.g. PROJ-123"
