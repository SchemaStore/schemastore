#:schema ../../schemas/json/commit-check.json
warn = "CC018"

[commit]
conventional_commits = false
message_pattern = '^PROJ-\d+: .+'
allow_commit_types = "feat,fix,docs"
ignore_authors = "dependabot[bot], renovate[bot]"
subject_max_length = 0
body_max_line_length = 0
ai_attribution = "forbid"

[branch]
conventional_branch = false
allow_branch_types = "feature,bugfix"
allow_branch_names = "develop,staging"

[files]
max_size = 1048576
max_path_length = 0

[pull_request]
check = "commits"
ai_declaration_checkboxes = "I have disclosed any AI tools I used"
ai_label = true
