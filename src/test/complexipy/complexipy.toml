#:schema ../../schemas/json/complexipy.json
paths = ["src", "tests"]
max-complexity-allowed = 10
exclude = ["migrations/**", "build/**"]
select = "complexity"
ignore = ["readability"]
snapshot-create = false
snapshot-ignore = false
quiet = false
ignore-complexity = false
failed = true
color = "auto"
sort = "file_name"
output-format = ["json", "sarif"]
output = "reports/"
cache-dir = ".complexipy_cache"
check-script = false
no-ignore = false
report-ignored = false
force-exclude = true

[diff]
branch = "main"
staged = true

[lsp]
inlay-hints = "always"
per-line-hints = true
diagnostics = false
diagnostic-range = "function"
hover = "function"
workspace-diagnostics = true
