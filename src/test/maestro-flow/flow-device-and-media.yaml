# yaml-language-server: $schema=../../schemas/json/maestro-flow.json
- launchApp:
    appId: com.example.app
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
      camera: allow
- setPermissions:
    permissions:
      all: allow
- setLocation:
    latitude: 52.3599976
    longitude: 4.8830301
- setOrientation: PORTRAIT
- setAirplaneMode: enabled
- toggleAirplaneMode
- setClipboard: custom@example.com
- pasteText
- addMedia:
    - './assets/foo.png'
    - './assets/foo.mp4'
- takeScreenshot: MainScreen
- takeScreenshot:
    path: LoginScreen
    cropOn:
      id: LoginFormContainer
- assertScreenshot: splash.png
- startRecording: recording
- stopRecording
- pressKey: enter
- eraseText: 10
- openLink:
    link: https://example.com
    browser: true
- killApp: com.example.app
- stopApp
- clearState
- waitForAnimationToEnd:
    timeout: 5000
