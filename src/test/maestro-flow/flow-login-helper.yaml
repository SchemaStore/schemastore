# yaml-language-server: $schema=../../schemas/json/maestro-flow.json
- launchApp:
    clearState: true
    arguments:
      e2eSkipHealth: "true"
- extendedWaitUntil:
    visible:
      id: "welcome-login-btn"
    timeout: 20000
- tapOn:
    id: "welcome-login-btn"
- tapOn:
    id: "login-email-input"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "login-submit-btn"
- extendedWaitUntil:
    visible: "Save Password?"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible:
        id: "timezone-mismatch-keep-btn"
    commands:
      - tapOn:
          id: "timezone-mismatch-keep-btn"
- extendedWaitUntil:
    visible:
      id: "header-home-logo"
    timeout: 20000
- assertVisible: "Today"
