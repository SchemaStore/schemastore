# yaml-language-server: $schema=../../schemas/json/github-workflow.json
name: Image version event
on:
  image_version:
    names:
      - 'MyNewImage'
      - 'MyOtherImage'
    versions:
      - 1.*
      - 2.*
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "A new image version is available"
