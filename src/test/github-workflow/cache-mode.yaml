# yaml-language-server: $schema=../../schemas/json/github-workflow.json
name: Cache modes
on: push
cache-mode: read
jobs:
  write-cache:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - run: echo write
  write-only-cache:
    runs-on: ubuntu-latest
    cache-mode: write-only
    steps:
      - run: echo write-only
  no-cache:
    uses: exampleowner/example/.github/workflows/test.yaml@main
    cache-mode: none
