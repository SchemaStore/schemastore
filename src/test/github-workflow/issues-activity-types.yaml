# yaml-language-server: $schema=../../schemas/json/github-workflow.json
name: Issues activity types
on:
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - pinned
      - unpinned
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - milestoned
      - demilestoned
      - typed
      - untyped
      - field_added
      - field_removed
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Report the issue type
        run: echo "${{ github.event.issue.type.name }}"
