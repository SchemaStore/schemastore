# yaml-language-server: $schema=../../schemas/json/github-workflow.json
name: Using fromJSON() for services key
on:
  workflow_call:
    inputs:
      services:
        type: string
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    services: ${{ fromJSON(inputs.services || vars.CI_SERVICES || '{}') }}
    steps:
      - run: echo ok
