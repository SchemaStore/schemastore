# yaml-language-server: $schema=../../schemas/json/typo3-file-storages.json
# config/system/file-storages.yaml
storages:
  1:
    name: fileadmin
    driver: Local
    default: true
    browsable: true
    public: true
    writable: true
    online: true
    autoExtractMetadata: true
    processingFolder: '1:/_processed_/'
    configuration:
      basePath: 'fileadmin/'
      pathType: relative
      caseSensitive: true
  2:
    name: 'Protected downloads'
    default: false
    public: false
    writable: '%env(TYPO3_DOWNLOADS_WRITABLE)%'
    online: 'on'
    allowedFileExtensions:
      - pdf
      - zip
    configuration:
      basePath: '/var/www/protected/downloads/'
      baseUri: 'https://downloads.example.com/'
      caseSensitive: '1'
  3:
    name: 'Amazon S3'
    driver: 'AusDriverAmazonS3'
    browsable: 1
    writable: 'off'
    allowedFileExtensions: 'jpg,png,webp,svg'
    configuration:
      bucket: my-bucket
      region: eu-central-1
      key: '%env(AWS_ACCESS_KEY_ID)%'
      secretKey: '%env(AWS_SECRET_ACCESS_KEY)%'
      publicBaseUrl: 'https://my-bucket.s3.eu-central-1.amazonaws.com'
