# yaml-language-server: $schema=../../schemas/json/netlify.json
backend:
  name: github
  repo: example/site
media_folder: static/uploads
i18n:
  structure: nested_folders
  locales: [en, de]
collections:
  - name: posts
    folder: content/posts
    fields:
      - { label: Title, name: title, widget: string }
