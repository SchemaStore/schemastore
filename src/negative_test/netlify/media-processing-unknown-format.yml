# yaml-language-server: $schema=../../schemas/json/netlify.json
backend:
  name: github
  repo: example/site
media_folder: static/uploads
media_processing:
  enabled: true
  format:
    enabled: true
    default: gif
collections:
  - name: posts
    folder: content/posts
    fields:
      - { label: Title, name: title, widget: string }
