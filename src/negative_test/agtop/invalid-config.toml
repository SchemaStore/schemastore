#:schema ../../schemas/json/agtop.json

[project.dev_server]
port_strategy = "random"
base_port = 0

[runtime]
default = "other"

[runtime.claude]
permission_mode = "approve"
max_turns = 0

[limits]
max_tokens_per_run = 0
max_cost_per_run = 0
max_concurrent_runs = 0

[merge]
merge_strategy = "fast-forward"

[integrations.jira]
base_url = ""
project_key = ""
auth_env = ""
user_env = ""
