# yaml-language-server: $schema=../../schemas/json/aurora-2.0.json
version: 0.0.1
boundedContextName: library
moduleName: book
moduleNames: books
aggregateName: LibraryBook
hasOAuth: true
hasTenant: false
hasAuditing: false
aggregateProperties:
  - name: id
    type: id
    primaryKey: true
    nullable: false
  - name: name
    type: varchar
    maxLength: 255
    nullable: false
additionalApis:
  - path: library/book/download-pdf
    resolverType: query
    httpMethod: get
    excludedLayers: []
