# yaml-language-server: $schema=../../schemas/json/dependabot-2.0.json
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily
    pull-request-branch-name:
      template: 'deps/{group_name}^{name}'
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
