name: 'Check Remote Schemas'

on:
  schedule:
    # Every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Allow only one concurrent run, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'check-remote'
  cancel-in-progress: false

jobs:
  check-remote:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'SchemaStore' }}
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - run: 'npm clean-install'
      # Fails (exit code 1) when a remote URL is unreachable or does not return
      # content that parses as a JSON Schema. If a URL is known to be broken,
      # add it to "remoteUrlCheckIgnore" in "./src/schema-validation.jsonc".
      - run: 'node ./cli.js check-remote'
